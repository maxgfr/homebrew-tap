name: Update web-watcher Formula

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  update-formula:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get latest version info
        id: get_release
        run: |
          set -euo pipefail

          REPO="maxgfr/web-watcher"

          # Prefer GitHub Releases (if they exist)
          RELEASE_DATA=$(curl -s "https://api.github.com/repos/${REPO}/releases/latest" || true)
          VERSION=$(echo "$RELEASE_DATA" | jq -r '.tag_name // empty')

          # Fallback: use latest tag when there is no release yet
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            TAG_DATA=$(curl -s "https://api.github.com/repos/${REPO}/tags?per_page=1")
            VERSION=$(echo "$TAG_DATA" | jq -r '.[0].name // empty')
          fi

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "No release/tag found"
            exit 1
          fi

          URL="https://github.com/maxgfr/web-watcher/archive/refs/tags/${VERSION}.tar.gz"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "url=$URL" >> $GITHUB_OUTPUT

          echo "Latest version: $VERSION"
          echo "Tarball URL: $URL"

      - name: Download and calculate SHA256
        id: calculate_sha
        run: |
          set -euo pipefail

          curl -L -o package.tar.gz "${{ steps.get_release.outputs.url }}"
          SHA256=$(sha256sum package.tar.gz | awk '{print $1}')

          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "SHA256: $SHA256"

          rm package.tar.gz

      - name: Check if update is needed
        id: check_update
        run: |
          set -euo pipefail

          CURRENT_VERSION=$(grep 'version "' Formula/web-watcher.rb | sed -E 's/.*version "([^"]+)".*/\1/')
          NEW_VERSION="${{ steps.get_release.outputs.version }}"

          echo "Current version: $CURRENT_VERSION"
          echo "New version: $NEW_VERSION"

          if [ "$CURRENT_VERSION" != "$NEW_VERSION" ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "Update needed!"
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
            echo "Already up to date"
          fi

      - name: Update Formula
        if: steps.check_update.outputs.needs_update == 'true'
        run: |
          set -euo pipefail

          VERSION="${{ steps.get_release.outputs.version }}"
          URL="${{ steps.get_release.outputs.url }}"
          SHA256="${{ steps.calculate_sha.outputs.sha256 }}"

          sed -i "s|url \".*\"|url \"$URL\"|g" Formula/web-watcher.rb
          sed -i "s|version \".*\"|version \"$VERSION\"|g" Formula/web-watcher.rb
          sed -i "s|sha256 \".*\"|sha256 \"$SHA256\"|g" Formula/web-watcher.rb

          echo "Formula updated successfully"

      - name: Commit and push changes
        if: steps.check_update.outputs.needs_update == 'true'
        run: |
          set -euo pipefail

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add Formula/web-watcher.rb
          git commit -m "chore: update web-watcher to ${{ steps.get_release.outputs.version }}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: steps.check_update.outputs.needs_update == 'true'
        run: |
          echo "✅ Formula updated to version ${{ steps.get_release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.get_release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: ${{ steps.get_release.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA256**: ${{ steps.calculate_sha.outputs.sha256 }}" >> $GITHUB_STEP_SUMMARY

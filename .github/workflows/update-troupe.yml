name: Update troupe Formula

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  update-formula:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get latest release info
        id: get_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_DATA=$(curl -s -H "Authorization: token $GH_TOKEN" https://api.github.com/repos/maxgfr/troupe/releases/latest)
          VERSION=$(echo "$RELEASE_DATA" | jq -r '.tag_name')

          if [ "$VERSION" == "null" ] || [ -z "$VERSION" ]; then
            echo "No release found"
            exit 1
          fi

          # The CLI in one file, named by the bare version: troupe-cli-0.3.0.mjs.
          URL="https://github.com/maxgfr/troupe/releases/download/${VERSION}/troupe-cli-${VERSION#v}.mjs"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "url=$URL" >> $GITHUB_OUTPUT

          echo "Latest version: $VERSION"
          echo "CLI URL: $URL"

      - name: Check if update is needed
        id: check_update
        run: |
          set -euo pipefail
          # No version line in the formula (brew infers it from the URL): the current tag is read from the URL.
          CURRENT_VERSION=$(grep 'url "' Formula/troupe.rb | sed -E 's|.*/releases/download/([^/]+)/.*|\1|')
          NEW_VERSION="${{ steps.get_release.outputs.version }}"

          echo "Current version: $CURRENT_VERSION"
          echo "New version: $NEW_VERSION"

          if [ "$CURRENT_VERSION" != "$NEW_VERSION" ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "Update needed!"
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
            echo "Already up to date"
          fi

      - name: Download and calculate SHA256
        id: calculate_sha
        if: steps.check_update.outputs.needs_update == 'true'
        run: |
          set -euo pipefail
          curl -fL -o troupe.mjs "${{ steps.get_release.outputs.url }}"
          SHA256=$(sha256sum troupe.mjs | awk '{print $1}')
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "SHA256: $SHA256"
          rm troupe.mjs

      - name: Update Formula
        if: steps.check_update.outputs.needs_update == 'true'
        run: |
          set -euo pipefail
          URL="${{ steps.get_release.outputs.url }}"
          SHA256="${{ steps.calculate_sha.outputs.sha256 }}"

          sed -i "s|url \".*\"|url \"$URL\"|g" Formula/troupe.rb
          sed -i "s|sha256 \".*\"|sha256 \"$SHA256\"|g" Formula/troupe.rb

          echo "Formula updated successfully"

      - name: Commit and push changes
        if: steps.check_update.outputs.needs_update == 'true'
        run: |
          set -euo pipefail
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add Formula/troupe.rb
          git commit -m "chore: update troupe to ${{ steps.get_release.outputs.version }}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: steps.check_update.outputs.needs_update == 'true'
        run: |
          echo "Formula updated to version ${{ steps.get_release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.get_release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: ${{ steps.get_release.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA256**: ${{ steps.calculate_sha.outputs.sha256 }}" >> $GITHUB_STEP_SUMMARY

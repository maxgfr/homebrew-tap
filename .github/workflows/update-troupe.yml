name: Update troupe Formula

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  update-formula:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get latest release info
        id: get_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_DATA=$(curl -s -H "Authorization: token $GH_TOKEN" https://api.github.com/repos/maxgfr/troupe/releases/latest)
          VERSION=$(echo "$RELEASE_DATA" | jq -r '.tag_name')

          if [ "$VERSION" == "null" ] || [ -z "$VERSION" ]; then
            echo "No release found"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Latest version: $VERSION"

      - name: Check if update is needed
        id: check_update
        run: |
          set -euo pipefail
          # No version line in the formula (brew reads it from the URLs): the current tag is read from the first URL.
          CURRENT_VERSION=$(grep -m1 'url "' Formula/troupe.rb | sed -E 's|.*/releases/download/([^/]+)/.*|\1|')
          NEW_VERSION="${{ steps.get_release.outputs.version }}"

          echo "Current version: $CURRENT_VERSION"
          echo "New version: $NEW_VERSION"

          if [ "$CURRENT_VERSION" != "$NEW_VERSION" ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "Update needed!"
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
            echo "Already up to date"
          fi

      # The release workflow attaches the binaries a few minutes after the
      # release: before that a download fails, and the next run updates.
      - name: Download binaries and calculate SHA256
        id: calculate_sha
        if: steps.check_update.outputs.needs_update == 'true'
        run: |
          set -euo pipefail
          BASE_URL="https://github.com/maxgfr/troupe/releases/download/${{ steps.get_release.outputs.version }}"
          for target in macos-arm64 macos-x64 linux-arm64 linux-x64; do
            curl -fL -o "troupe-$target" "$BASE_URL/troupe-$target"
            SHA=$(sha256sum "troupe-$target" | awk '{print $1}')
            echo "sha_${target/-/_}=$SHA" >> $GITHUB_OUTPUT
            echo "$target SHA256: $SHA"
            rm "troupe-$target"
          done

      - name: Update Formula
        if: steps.check_update.outputs.needs_update == 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.get_release.outputs.version }}"

          sed -i -E "s|releases/download/v[^/]+/troupe-|releases/download/${VERSION}/troupe-|" Formula/troupe.rb

          # Each sha256 follows its binary's url line.
          awk \
            -v macos_arm64="${{ steps.calculate_sha.outputs.sha_macos_arm64 }}" \
            -v macos_x64="${{ steps.calculate_sha.outputs.sha_macos_x64 }}" \
            -v linux_arm64="${{ steps.calculate_sha.outputs.sha_linux_arm64 }}" \
            -v linux_x64="${{ steps.calculate_sha.outputs.sha_linux_x64 }}" '
            /url ".*troupe-macos-arm64"/ { sha = macos_arm64 }
            /url ".*troupe-macos-x64"/ { sha = macos_x64 }
            /url ".*troupe-linux-arm64"/ { sha = linux_arm64 }
            /url ".*troupe-linux-x64"/ { sha = linux_x64 }
            /sha256 "/ && sha != "" { sub(/sha256 "[^"]*"/, "sha256 \"" sha "\""); sha = "" }
            { print }
          ' Formula/troupe.rb > Formula/troupe.rb.tmp
          mv Formula/troupe.rb.tmp Formula/troupe.rb

          echo "Formula updated successfully"

      - name: Commit and push changes
        if: steps.check_update.outputs.needs_update == 'true'
        run: |
          set -euo pipefail
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add Formula/troupe.rb
          git commit -m "chore: update troupe to ${{ steps.get_release.outputs.version }}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: steps.check_update.outputs.needs_update == 'true'
        run: |
          echo "Formula updated to version ${{ steps.get_release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.get_release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **macOS arm64 SHA256**: ${{ steps.calculate_sha.outputs.sha_macos_arm64 }}" >> $GITHUB_STEP_SUMMARY
          echo "- **macOS x64 SHA256**: ${{ steps.calculate_sha.outputs.sha_macos_x64 }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Linux arm64 SHA256**: ${{ steps.calculate_sha.outputs.sha_linux_arm64 }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Linux x64 SHA256**: ${{ steps.calculate_sha.outputs.sha_linux_x64 }}" >> $GITHUB_STEP_SUMMARY

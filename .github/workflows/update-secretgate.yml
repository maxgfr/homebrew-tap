name: Update secretgate Formula

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

jobs:
  update-formula:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get latest release info
        id: get_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_DATA=$(curl -s -H "Authorization: token $GH_TOKEN" https://api.github.com/repos/maxgfr/secretgate/releases/latest)
          VERSION=$(echo "$RELEASE_DATA" | jq -r '.tag_name')

          if [ "$VERSION" == "null" ]; then
            echo "No release found"
            exit 1
          fi

          # brew style rejects a leading 'v' in `version`, so the formula stores the
          # bare number while the release URLs keep the tag.
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "number=${VERSION#v}" >> $GITHUB_OUTPUT
          echo "Latest version: $VERSION"

      - name: Download binaries and calculate SHA256
        id: calculate_sha
        run: |
          VERSION="${{ steps.get_release.outputs.version }}"
          BASE_URL="https://github.com/maxgfr/secretgate/releases/download/${VERSION}"

          # The release also ships secretgate.mjs (the skill's Node bundle) and
          # SHA256SUMS; neither is a Homebrew artifact, so neither is checksummed here.
          for binary in secretgate-macos-arm64 secretgate-macos-x64 secretgate-linux-x64 secretgate-linux-arm64; do
            echo "Downloading ${binary}..."
            curl -L -f -o "${binary}" "${BASE_URL}/${binary}" || { echo "Failed to download ${binary}"; exit 1; }
            SHA=$(sha256sum "${binary}" | awk '{print $1}')
            KEY=$(echo "${binary}" | tr '-' '_')
            echo "sha_${KEY}=${SHA}" >> $GITHUB_OUTPUT
            echo "${binary} SHA256: ${SHA}"
          done

          rm -f secretgate-*

      - name: Check if update is needed
        id: check_update
        run: |
          CURRENT_VERSION=$(grep 'version "' Formula/secretgate.rb | head -1 | sed -E 's/.*version "([^"]+)".*/\1/')
          NEW_VERSION="${{ steps.get_release.outputs.number }}"

          echo "Current version: $CURRENT_VERSION"
          echo "New version: $NEW_VERSION"

          if [ "$CURRENT_VERSION" != "$NEW_VERSION" ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "Update needed!"
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
            echo "Already up to date"
          fi

      - name: Update Formula
        if: steps.check_update.outputs.needs_update == 'true'
        run: |
          VERSION="${{ steps.get_release.outputs.version }}"
          NUMBER="${{ steps.get_release.outputs.number }}"
          SHA_MACOS_ARM64="${{ steps.calculate_sha.outputs.sha_secretgate_macos_arm64 }}"
          SHA_MACOS_X64="${{ steps.calculate_sha.outputs.sha_secretgate_macos_x64 }}"
          SHA_LINUX_X64="${{ steps.calculate_sha.outputs.sha_secretgate_linux_x64 }}"
          SHA_LINUX_ARM64="${{ steps.calculate_sha.outputs.sha_secretgate_linux_arm64 }}"

          cat > Formula/secretgate.rb << EOF
          class Secretgate < Formula
            desc "Local secrets firewall for coding agents (Claude Code, Codex, OpenCode)"
            homepage "https://github.com/maxgfr/secretgate"
            version "${NUMBER}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/maxgfr/secretgate/releases/download/${VERSION}/secretgate-macos-arm64"
                sha256 "${SHA_MACOS_ARM64}"
              end

              on_intel do
                url "https://github.com/maxgfr/secretgate/releases/download/${VERSION}/secretgate-macos-x64"
                sha256 "${SHA_MACOS_X64}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/maxgfr/secretgate/releases/download/${VERSION}/secretgate-linux-arm64"
                sha256 "${SHA_LINUX_ARM64}"
              end

              on_intel do
                url "https://github.com/maxgfr/secretgate/releases/download/${VERSION}/secretgate-linux-x64"
                sha256 "${SHA_LINUX_X64}"
              end
            end

            def install
              binary = Dir["secretgate-*"].first

              if binary.nil?
                opoo "No secretgate binary found"
                return
              end

              chmod 0755, binary
              bin.install binary => "secretgate"
            end

            def caveats
              <<~EOS
                Run \`secretgate init\` to protect Claude Code / Codex / OpenCode.
                The hooks run a copy pinned under ~/.secretgate/bin, so re-run
                \`secretgate init\` after each \`brew upgrade\`.
              EOS
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/secretgate --version")
              # A real offline scan: a fake AWS key id, built by concatenation so no
              # literal credential sits in this file. Findings exit 1.
              fake = "AKIA" + "Q7R2M3XBL4WPZ6TK"
              output = pipe_output("#{bin}/secretgate scan - --no-gitleaks", "aws key #{fake} ok\n", 1)
              assert_match "aws-access-token", output
            end
          end
          EOF

          echo "Formula updated successfully"

      - name: Commit and push changes
        if: steps.check_update.outputs.needs_update == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add Formula/secretgate.rb
          git commit -m "chore: update secretgate to ${{ steps.get_release.outputs.number }}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: steps.check_update.outputs.needs_update == 'true'
        run: |
          echo "✅ Formula updated to version ${{ steps.get_release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.get_release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **macOS ARM64 SHA256**: ${{ steps.calculate_sha.outputs.sha_secretgate_macos_arm64 }}" >> $GITHUB_STEP_SUMMARY
          echo "- **macOS x64 SHA256**: ${{ steps.calculate_sha.outputs.sha_secretgate_macos_x64 }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Linux ARM64 SHA256**: ${{ steps.calculate_sha.outputs.sha_secretgate_linux_arm64 }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Linux x64 SHA256**: ${{ steps.calculate_sha.outputs.sha_secretgate_linux_x64 }}" >> $GITHUB_STEP_SUMMARY

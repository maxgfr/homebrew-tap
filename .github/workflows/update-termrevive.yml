name: Update termrevive Formula

on:
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:

jobs:
  update-formula:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get latest release info
        id: get_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Releases are tagged `v*`; filter on it rather than trusting `releases/latest`.
          VERSION=$(curl -s -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/maxgfr/termrevive/releases?per_page=20" \
            | jq -r '[.[] | select(.draft == false and .prerelease == false and (.tag_name | test("^v[0-9]")))][0].tag_name')

          if [ -z "$VERSION" ] || [ "$VERSION" == "null" ]; then
            echo "No release found"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Latest version: $VERSION"

      - name: Download binaries and calculate SHA256
        id: calculate_sha
        run: |
          VERSION="${{ steps.get_release.outputs.version }}"
          BASE_URL="https://github.com/maxgfr/termrevive/releases/download/${VERSION}"

          # macOS only, binaries named by Rust target triple. SHA256SUMS is not a Homebrew artifact.
          for binary in termrevive-aarch64-apple-darwin termrevive-x86_64-apple-darwin; do
            echo "Downloading ${binary}..."
            curl -L -f -o "${binary}" "${BASE_URL}/${binary}" || { echo "Failed to download ${binary}"; exit 1; }
            SHA=$(sha256sum "${binary}" | awk '{print $1}')
            KEY=$(echo "${binary}" | tr '-' '_')
            echo "sha_${KEY}=${SHA}" >> "$GITHUB_OUTPUT"
            echo "${binary} SHA256: ${SHA}"
          done

          rm -f termrevive-*

      - name: Check if update is needed
        id: check_update
        run: |
          # No version line in the formula (brew reads it from the URLs): the current tag is read from the first URL.
          CURRENT_VERSION=$(grep -m1 'url "' Formula/termrevive.rb | sed -E 's|.*/releases/download/([^/]+)/.*|\1|')
          NEW_VERSION="${{ steps.get_release.outputs.version }}"

          echo "Current version: $CURRENT_VERSION"
          echo "New version: $NEW_VERSION"

          if [ "$CURRENT_VERSION" != "$NEW_VERSION" ]; then
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
            echo "Update needed!"
          else
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date"
          fi

      - name: Update Formula
        if: steps.check_update.outputs.needs_update == 'true'
        run: |
          VERSION="${{ steps.get_release.outputs.version }}"
          SHA_MACOS_ARM64="${{ steps.calculate_sha.outputs.sha_termrevive_aarch64_apple_darwin }}"
          SHA_MACOS_X64="${{ steps.calculate_sha.outputs.sha_termrevive_x86_64_apple_darwin }}"

          cat > Formula/termrevive.rb << EOF
          class Termrevive < Formula
            desc "Save and restore terminal sessions and their running programs across reboots"
            homepage "https://github.com/maxgfr/termrevive"
            license "MIT"

            depends_on :macos

            on_macos do
              on_arm do
                url "https://github.com/maxgfr/termrevive/releases/download/${VERSION}/termrevive-aarch64-apple-darwin"
                sha256 "${SHA_MACOS_ARM64}"
              end

              on_intel do
                url "https://github.com/maxgfr/termrevive/releases/download/${VERSION}/termrevive-x86_64-apple-darwin"
                sha256 "${SHA_MACOS_X64}"
              end
            end

            def install
              binary = Dir["termrevive-*"].first

              if binary.nil?
                opoo "No termrevive binary found"
                return
              end

              chmod 0755, binary
              bin.install binary => "termrevive"
            end

            def caveats
              <<~EOS
                termrevive restores Ghostty, iTerm2, kitty and Terminal.app windows. Run
                  termrevive doctor --fix
                once: terminals then stop reopening their own windows on top of a restore,
                and kitty gets the remote control termrevive drives it with (restart kitty).
                Agent skill: npx skills add maxgfr/termrevive
                Using its LaunchAgents? Re-run \`termrevive install\` after each upgrade.
              EOS
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/termrevive --version")
              # Offline: an empty state directory has no snapshot, and no terminal is touched.
              ENV["XDG_STATE_HOME"] = testpath/"state"
              assert_equal "no snapshot yet", shell_output("#{bin}/termrevive list").strip
              assert_match "name: termrevive", shell_output("#{bin}/termrevive skill")
            end
          end
          EOF

          echo "Formula updated successfully"

      - name: Commit and push changes
        if: steps.check_update.outputs.needs_update == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add Formula/termrevive.rb
          git commit -m "chore: update termrevive to ${{ steps.get_release.outputs.version }}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: steps.check_update.outputs.needs_update == 'true'
        run: |
          {
            echo "✅ Formula updated to version ${{ steps.get_release.outputs.version }}"
            echo ""
            echo "- **Version**: ${{ steps.get_release.outputs.version }}"
            echo "- **macOS ARM64 SHA256**: ${{ steps.calculate_sha.outputs.sha_termrevive_aarch64_apple_darwin }}"
            echo "- **macOS x64 SHA256**: ${{ steps.calculate_sha.outputs.sha_termrevive_x86_64_apple_darwin }}"
          } >> "$GITHUB_STEP_SUMMARY"

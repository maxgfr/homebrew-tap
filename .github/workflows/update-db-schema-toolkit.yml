name: Update db-schema-toolkit Formula

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

jobs:
  update-formula:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get latest version from npm
        id: get_release
        run: |
          set -euo pipefail

          PACKAGE="db-schema-toolkit"

          # Get latest version from npm registry
          VERSION=$(curl -s "https://registry.npmjs.org/${PACKAGE}/latest" | jq -r '.version // empty')

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "No version found on npm"
            exit 1
          fi

          URL="https://registry.npmjs.org/${PACKAGE}/-/${PACKAGE}-${VERSION}.tgz"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "url=$URL" >> $GITHUB_OUTPUT

          echo "Latest version: $VERSION"
          echo "Tarball URL: $URL"

      - name: Download and calculate SHA256
        id: calculate_sha
        run: |
          set -euo pipefail

          curl -L -o package.tgz "${{ steps.get_release.outputs.url }}"
          SHA256=$(sha256sum package.tgz | awk '{print $1}')

          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "SHA256: $SHA256"

          rm package.tgz

      - name: Check if update is needed
        id: check_update
        run: |
          set -euo pipefail

          # Extract current version from the URL in the formula (no explicit version line)
          CURRENT_VERSION=$(grep 'url "' Formula/db-schema-toolkit.rb | sed -E 's/.*db-schema-toolkit-([0-9][^"]+)\.tgz.*/\1/')
          NEW_VERSION="${{ steps.get_release.outputs.version }}"

          echo "Current version: $CURRENT_VERSION"
          echo "New version: $NEW_VERSION"

          if [ "$CURRENT_VERSION" != "$NEW_VERSION" ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "Update needed!"
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
            echo "Already up to date"
          fi

      - name: Update Formula
        if: steps.check_update.outputs.needs_update == 'true'
        run: |
          set -euo pipefail

          URL="${{ steps.get_release.outputs.url }}"
          SHA256="${{ steps.calculate_sha.outputs.sha256 }}"

          sed -i "s|url \".*\"|url \"$URL\"|g" Formula/db-schema-toolkit.rb
          sed -i "s|sha256 \".*\"|sha256 \"$SHA256\"|g" Formula/db-schema-toolkit.rb

          echo "Formula updated successfully"

      - name: Commit and push changes
        if: steps.check_update.outputs.needs_update == 'true'
        run: |
          set -euo pipefail

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add Formula/db-schema-toolkit.rb
          git commit -m "chore: update db-schema-toolkit to ${{ steps.get_release.outputs.version }}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: steps.check_update.outputs.needs_update == 'true'
        run: |
          echo "✅ Formula updated to version ${{ steps.get_release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.get_release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: ${{ steps.get_release.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA256**: ${{ steps.calculate_sha.outputs.sha256 }}" >> $GITHUB_STEP_SUMMARY

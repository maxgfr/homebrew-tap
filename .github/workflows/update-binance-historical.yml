name: Update binance-historical Formula

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-formula:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get latest release info
        id: get_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get latest release information
          RELEASE_DATA=$(curl -s -H "Authorization: token $GH_TOKEN" https://api.github.com/repos/maxgfr/binance-historical/releases/latest)

          # Extract version (tag_name)
          VERSION=$(echo "$RELEASE_DATA" | jq -r '.tag_name')

          # Tags are v-prefixed. The formula has no `version`: Homebrew scans it from
          # the URL, and the update check reads it back from there, without the `v`.
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "number=${VERSION#v}" >> $GITHUB_OUTPUT
          echo "Latest version: $VERSION"

      - name: Download binaries and calculate SHA256
        id: calculate_sha
        run: |
          VERSION="${{ steps.get_release.outputs.version }}"
          BASE_URL="https://github.com/maxgfr/binance-historical/releases/download/${VERSION}"

          # Download macOS ARM64 binary
          echo "Downloading macOS ARM64 binary..."
          curl -L -o binance-macos-arm64 "${BASE_URL}/binance-historical-macos-arm64"
          SHA_MACOS_ARM64=$(sha256sum binance-macos-arm64 | awk '{print $1}')
          echo "sha_macos_arm64=$SHA_MACOS_ARM64" >> $GITHUB_OUTPUT
          echo "macOS ARM64 SHA256: $SHA_MACOS_ARM64"

          # Download macOS x64 binary
          echo "Downloading macOS x64 binary..."
          curl -L -o binance-macos-x64 "${BASE_URL}/binance-historical-macos-x64"
          SHA_MACOS_X64=$(sha256sum binance-macos-x64 | awk '{print $1}')
          echo "sha_macos_x64=$SHA_MACOS_X64" >> $GITHUB_OUTPUT
          echo "macOS x64 SHA256: $SHA_MACOS_X64"

          # Download Linux x64 binary
          echo "Downloading Linux x64 binary..."
          curl -L -o binance-linux-x64 "${BASE_URL}/binance-historical-linux-x64"
          SHA_LINUX_X64=$(sha256sum binance-linux-x64 | awk '{print $1}')
          echo "sha_linux_x64=$SHA_LINUX_X64" >> $GITHUB_OUTPUT
          echo "Linux x64 SHA256: $SHA_LINUX_X64"

          # Cleanup
          rm binance-*

      - name: Check if update is needed
        id: check_update
        run: |
          CURRENT_VERSION=$(grep -m1 'url "' Formula/binance-historical.rb | sed -E 's#.*/(releases/download|archive/refs/tags)/v?([^/"]+)(/|\.tar\.gz").*#\2#')
          NEW_VERSION="${{ steps.get_release.outputs.number }}"

          echo "Current version: $CURRENT_VERSION"
          echo "New version: $NEW_VERSION"

          if [ "$CURRENT_VERSION" != "$NEW_VERSION" ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "Update needed!"
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
            echo "Already up to date"
          fi

      - name: Update Formula
        if: steps.check_update.outputs.needs_update == 'true'
        run: |
          VERSION="${{ steps.get_release.outputs.version }}"
          SHA_MACOS_ARM64="${{ steps.calculate_sha.outputs.sha_macos_arm64 }}"
          SHA_MACOS_X64="${{ steps.calculate_sha.outputs.sha_macos_x64 }}"
          SHA_LINUX_X64="${{ steps.calculate_sha.outputs.sha_linux_x64 }}"

          # Update URLs
          sed -i "s|https://github.com/maxgfr/binance-historical/releases/download/v[^/]*/binance-historical-macos-arm64|https://github.com/maxgfr/binance-historical/releases/download/${VERSION}/binance-historical-macos-arm64|" Formula/binance-historical.rb
          sed -i "s|https://github.com/maxgfr/binance-historical/releases/download/v[^/]*/binance-historical-macos-x64|https://github.com/maxgfr/binance-historical/releases/download/${VERSION}/binance-historical-macos-x64|" Formula/binance-historical.rb
          sed -i "s|https://github.com/maxgfr/binance-historical/releases/download/v[^/]*/binance-historical-linux-x64|https://github.com/maxgfr/binance-historical/releases/download/${VERSION}/binance-historical-linux-x64|" Formula/binance-historical.rb

          # Each sha256 line sits right under its url line.
          sed -i "/binance-historical-macos-arm64\"/{n;s/sha256 \"[0-9a-f]*\"/sha256 \"${SHA_MACOS_ARM64}\"/}" Formula/binance-historical.rb
          sed -i "/binance-historical-macos-x64\"/{n;s/sha256 \"[0-9a-f]*\"/sha256 \"${SHA_MACOS_X64}\"/}" Formula/binance-historical.rb
          sed -i "/binance-historical-linux-x64\"/{n;s/sha256 \"[0-9a-f]*\"/sha256 \"${SHA_LINUX_X64}\"/}" Formula/binance-historical.rb

          echo "Formula updated successfully"

      - name: Commit and push changes
        if: steps.check_update.outputs.needs_update == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add Formula/binance-historical.rb
          git commit -m "chore: update binance-historical to ${{ steps.get_release.outputs.version }}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: steps.check_update.outputs.needs_update == 'true'
        run: |
          echo "✅ Formula updated to version ${{ steps.get_release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.get_release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **macOS ARM64 SHA256**: ${{ steps.calculate_sha.outputs.sha_macos_arm64 }}" >> $GITHUB_STEP_SUMMARY
          echo "- **macOS x64 SHA256**: ${{ steps.calculate_sha.outputs.sha_macos_x64 }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Linux x64 SHA256**: ${{ steps.calculate_sha.outputs.sha_linux_x64 }}" >> $GITHUB_STEP_SUMMARY

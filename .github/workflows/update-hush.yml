name: Update hush Formula

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

jobs:
  update-formula:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get latest release info
        id: get_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The hush repo hosts a web app and a CLI; only `cli-v*` tags are CLI releases.
          VERSION=$(curl -s -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/maxgfr/hush/releases?per_page=20" \
            | jq -r '[.[] | select(.draft == false and .prerelease == false and (.tag_name | test("^cli-v[0-9]")))][0].tag_name')

          if [ -z "$VERSION" ] || [ "$VERSION" == "null" ]; then
            echo "No release found"
            exit 1
          fi

          # Tags are `cli-v`-prefixed. The formula has no `version`: Homebrew scans
          # it from the URL, and the update check reads it back from there.
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "number=${VERSION#cli-v}" >> $GITHUB_OUTPUT
          echo "Latest version: $VERSION"

      - name: Download binaries and calculate SHA256
        id: calculate_sha
        run: |
          VERSION="${{ steps.get_release.outputs.version }}"
          BASE_URL="https://github.com/maxgfr/hush/releases/download/${VERSION}"

          # Binaries are named by Rust target triple. SHA256SUMS is not a Homebrew artifact.
          for binary in hush-aarch64-apple-darwin hush-x86_64-apple-darwin hush-aarch64-unknown-linux-gnu hush-x86_64-unknown-linux-gnu; do
            echo "Downloading ${binary}..."
            curl -L -f -o "${binary}" "${BASE_URL}/${binary}" || { echo "Failed to download ${binary}"; exit 1; }
            SHA=$(sha256sum "${binary}" | awk '{print $1}')
            KEY=$(echo "${binary}" | tr '-' '_')
            echo "sha_${KEY}=${SHA}" >> $GITHUB_OUTPUT
            echo "${binary} SHA256: ${SHA}"
          done

          rm -f hush-*

      - name: Check if update is needed
        id: check_update
        run: |
          CURRENT_VERSION=$(grep -m1 'url "' Formula/hush.rb | sed -E 's#.*/releases/download/cli-v([^/"]+)/.*#\1#')
          NEW_VERSION="${{ steps.get_release.outputs.number }}"

          echo "Current version: $CURRENT_VERSION"
          echo "New version: $NEW_VERSION"

          if [ "$CURRENT_VERSION" != "$NEW_VERSION" ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "Update needed!"
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
            echo "Already up to date"
          fi

      - name: Update Formula
        if: steps.check_update.outputs.needs_update == 'true'
        run: |
          VERSION="${{ steps.get_release.outputs.version }}"
          SHA_MACOS_ARM64="${{ steps.calculate_sha.outputs.sha_hush_aarch64_apple_darwin }}"
          SHA_MACOS_X64="${{ steps.calculate_sha.outputs.sha_hush_x86_64_apple_darwin }}"
          SHA_LINUX_ARM64="${{ steps.calculate_sha.outputs.sha_hush_aarch64_unknown_linux_gnu }}"
          SHA_LINUX_X64="${{ steps.calculate_sha.outputs.sha_hush_x86_64_unknown_linux_gnu }}"

          cat > Formula/hush.rb << EOF
          class Hush < Formula
            desc "Post-quantum, end-to-end encrypted chat and file transfer"
            homepage "https://github.com/maxgfr/hush"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/maxgfr/hush/releases/download/${VERSION}/hush-aarch64-apple-darwin"
                sha256 "${SHA_MACOS_ARM64}"
              end

              on_intel do
                url "https://github.com/maxgfr/hush/releases/download/${VERSION}/hush-x86_64-apple-darwin"
                sha256 "${SHA_MACOS_X64}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/maxgfr/hush/releases/download/${VERSION}/hush-aarch64-unknown-linux-gnu"
                sha256 "${SHA_LINUX_ARM64}"
              end

              on_intel do
                url "https://github.com/maxgfr/hush/releases/download/${VERSION}/hush-x86_64-unknown-linux-gnu"
                sha256 "${SHA_LINUX_X64}"
              end
            end

            def install
              binary = Dir["hush-*"].first

              if binary.nil?
                opoo "No hush binary found"
                return
              end

              chmod 0755, binary
              bin.install binary => "hush"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/hush --version")
              # A fresh link, generated offline: the same format the web app opens.
              link = shell_output("#{bin}/hush new").strip
              assert_match %r{^https://maxgfr\.github\.io/hush/#[1-9]\.s\.[A-Za-z0-9_-]{43}\.[0-9a-z]+$}, link
            end
          end
          EOF

          echo "Formula updated successfully"

      - name: Commit and push changes
        if: steps.check_update.outputs.needs_update == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add Formula/hush.rb
          git commit -m "chore: update hush to ${{ steps.get_release.outputs.version }}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: steps.check_update.outputs.needs_update == 'true'
        run: |
          echo "✅ Formula updated to version ${{ steps.get_release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.get_release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **macOS ARM64 SHA256**: ${{ steps.calculate_sha.outputs.sha_hush_aarch64_apple_darwin }}" >> $GITHUB_STEP_SUMMARY
          echo "- **macOS x64 SHA256**: ${{ steps.calculate_sha.outputs.sha_hush_x86_64_apple_darwin }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Linux ARM64 SHA256**: ${{ steps.calculate_sha.outputs.sha_hush_aarch64_unknown_linux_gnu }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Linux x64 SHA256**: ${{ steps.calculate_sha.outputs.sha_hush_x86_64_unknown_linux_gnu }}" >> $GITHUB_STEP_SUMMARY
